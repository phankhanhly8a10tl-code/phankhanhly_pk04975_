      query: '',
      filter: 'all',
      done: JSON.parse(localStorage.getItem(K.DONE) || '[]'),
      notes: JSON.parse(localStorage.getItem(K.NOTES) || '{}'),
      scores: JSON.parse(localStorage.getItem(K.QUIZ) || '{}'),
      ans: {},
      submitted: false
    };
    let vidTimer = null;

    const $ = id => document.getElementById(id);
    const curLesson = () => LESSONS.find(l => l.id === st.curId) || LESSONS[0];

    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      const bg = type === 'ok' ? 'bg-emerald-600' : type === 'warn' ? 'bg-amber-600' : 'bg-slate-900 dark:bg-brand-600';
      el.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium pointer-events-auto fade-in`;
      el.textContent = msg;
      $('toast-box').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 2500);
    }

    function downloadFile(name, text) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
      toast(`Đã tải xuống: ${name}`, 'ok');
    }

    function updateStats() {
      const pct = Math.round((st.done.length / LESSONS.length) * 100);
      $('prog-text').textContent = `${st.done.length}/${LESSONS.length} (${pct}%)`;
      $('prog-bar').style.width = `${pct}%`;
      const vals = Object.values(st.scores);
      $('avg-score').textContent = vals.length ? `${Math.round(vals.reduce((a, b) => a + b, 0) / vals.length)}% (${vals.length}/8 bài)` : 'Chưa thi';
    }

    function renderNav() {
      const q = st.query.trim().toLowerCase();
      const list = LESSONS.filter(l => {
        const isDone = st.done.includes(l.id);
        if (st.filter === 'done' && !isDone) return false;
        if (st.filter === 'todo' && isDone) return false;
        if (!q) return true;
        return [l.title, l.sub, l.tag, ...l.notes, ...l.cards.flat()].join(' ').toLowerCase().includes(q);
      });
      $('nav-count').textContent = `${list.length} bài`;
      $('nav-list').innerHTML = list.length ? list.map(l => {
        const active = l.id === st.curId, done = st.done.includes(l.id), sc = st.scores[l.id];
        return `
          <button onclick="selectLesson(${l.id})" class="w-full text-left p-3 rounded-2xl border transition flex items-start gap-3 ${active ? 'bg-brand-50 dark:bg-brand-950/60 border-brand-300 dark:border-brand-700' : 'border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/60'}">
            <span class="w-7 h-7 rounded-xl flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${done ? 'bg-emerald-500 text-white' : active ? 'bg-brand-600 text-white' : 'bg-slate-200 dark:bg-slate-800'}">${done ? '✓' : l.id}</span>
            <div class="min-w-0 flex-1">
              <div class="flex justify-between items-center text-[10px]">
                <span class="font-bold uppercase ${active ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400'}">${l.code}</span>
                ${sc !== undefined ? `<span class="px-1.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-mono font-bold">Quiz ${sc}%</span>` : ''}
              </div>
              <p class="text-xs font-bold leading-snug line-clamp-2 mt-0.5">${l.title}</p>
            </div>
          </button>`;
      }).join('') : `<p class="p-6 text-center text-xs text-slate-500">Không tìm thấy bài học phù hợp.</p>`;
    }

    // =========================================================================
    // RENDER 4 TAB NỘI DUNG
    // =========================================================================
    function renderLecture(l) {
      const sl = l.slides[st.slide] || l.slides[0];
      return `
        <div class="space-y-6">
          <div class="rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-brand-950 text-white p-5 sm:p-6 shadow-md border border-slate-800">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div class="flex items-center gap-2 text-xs">
                <span class="px-2.5 py-1 rounded-lg bg-brand-500/20 text-brand-300 font-bold">SLIDE TRÌNH CHIẾU</span>
                <span class="font-mono text-slate-400">Trang ${st.slide + 1}/${l.slides.length}</span>
              </div>
              <button onclick="exportMd()" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold transition">⬇️ Tải bài giảng (.md)</button>
            </div>
            <div class="min-h-[185px] flex flex-col justify-between bg-white/5 rounded-2xl p-5 border border-white/10">
              <div>
                <h4 class="text-base sm:text-lg font-extrabold text-cyan-300 mb-3">${sl.t}</h4>
                <ul class="space-y-2 text-sm text-slate-100">
                  ${sl.b.map(x => `<li class="flex gap-2"><span class="text-brand-400 font-bold">▸</span><span>${x}</span></li>`).join('')}
                </ul>
              </div>
              <div class="mt-5 pt-3 border-t border-white/10 flex items-center justify-between">
                <button onclick="moveSlide(-1)" ${st.slide === 0 ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 disabled:opacity-30 text-xs font-bold">◀ Trước</button>
                <div class="flex gap-1.5">${l.slides.map((_, i) => `<button onclick="goSlide(${i})" class="h-2 rounded-full transition-all ${i === st.slide ? 'w-6 bg-cyan-400' : 'w-2 bg-white/30'}"></button>`).join('')}</div>
                <button onclick="moveSlide(1)" ${st.slide === l.slides.length - 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 disabled:opacity-30 text-xs font-bold">Tiếp ▶</button>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${l.cards.map(([k, v]) => `
              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4">
                <div class="text-xs font-extrabold uppercase text-brand-600 dark:text-brand-400 mb-1">${k}</div>
                <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${v}</p>
              </div>`).join('')}
          </div>

          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6">
            <h3 class="text-base font-extrabold mb-3">📚 Kiến thức trọng tâm cần nhớ</h3>
            <ul class="space-y-2.5 text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
              ${l.notes.map(n => `<li class="flex gap-2.5"><span class="w-1.5 h-1.5 rounded-full bg-brand-500 mt-2 shrink-0"></span><span>${n}</span></li>`).join('')}
            </ul>
          </div>
        </div>`;
    }

    function renderDiagram(l) {
      return `
        <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6 space-y-5">
          <div>
            <h3 class="text-base sm:text-lg font-extrabold">🖼️ Sơ đồ Kiến trúc & Luồng xử lý — ${l.title}</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Trực quan hóa 4 giai đoạn/thành phần cốt lõi của chuyên đề</p>
          </div>
          <div class="overflow-x-auto">
            <svg viewBox="0 0 840 160" class="w-full min-w-[620px] h-auto">
              <line x1="90" y1="80" x2="750" y2="80" stroke="#6366f1" stroke-width="4" class="animate-dash" />
              ${l.diagram.map((node, i) => `
                <g transform="translate(${20 + i * 205}, 20)">
                  <rect width="185" height="120" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
                  <circle cx="92" cy="28" r="14" fill="#4f46e5" />
                  <text x="92" y="33" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">0${i + 1}</text>
                  <text x="92" y="62" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">${node.k}</text>
                  <text x="92" y="86" text-anchor="middle" fill="#e2e8f0" font-size="10.5">${node.v}</text>
                </g>`).join('')}
            </svg>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            ${l.diagram.map((d, i) => `
              <div class="p-4 rounded-2xl text-white ${d.c} shadow-xs">
                <div class="text-[11px] font-mono opacity-80">BƯỚC 0${i + 1}</div>
                <div class="font-extrabold text-sm mt-0.5">${d.k}</div>
                <div class="text-xs mt-1 opacity-95">${d.v}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    function renderVideo(l) {
      const seg = l.video[st.vidIdx] || l.video[0];
      return `
        <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6">
          <div class="flex items-center justify-between gap-2 mb-4">
            <div>
              <h3 class="text-base sm:text-lg font-extrabold">🎬 Video Bài giảng Minh họa Động</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Hoạt ảnh trực quan kèm phụ đề thuyết minh từng phân đoạn</p>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-mono font-bold bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300">● INTERACTIVE</span>
          </div>
          <div class="rounded-2xl overflow-hidden bg-slate-950 border border-slate-800">
            <div class="min-h-[250px] p-6 flex flex-col items-center justify-center text-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-brand-900/40 via-slate-950 to-slate-950">
              <div class="animate-float mb-3">
                <svg viewBox="0 0 340 100" class="w-72 sm:w-80 h-auto mx-auto">
                  <rect x="10" y="20" width="85" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                  <text x="52" y="54" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">CHỦ ĐỀ ${l.id}</text>
                  <line x1="95" y1="50" x2="128" y2="50" stroke="#818cf8" stroke-width="3" class="${st.playing ? 'animate-dash' : ''}" />
                  <rect x="128" y="12" width="84" height="76" rx="16" fill="#312e81" stroke="#34d399" stroke-width="2.5" />
                  <text x="170" y="48" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">COM109</text>
                  <text x="170" y="65" text-anchor="middle" fill="#e0e7ff" font-size="10">${seg.t}</text>
                  <line x1="212" y1="50" x2="245" y2="50" stroke="#34d399" stroke-width="3" class="${st.playing ? 'animate-dash' : ''}" />
                  <rect x="245" y="20" width="85" height="60" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
                  <text x="287" y="54" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">ỨNG DỤNG</text>
                </svg>
              </div>
              <span class="px-3 py-1 rounded-full bg-brand-500/20 text-brand-300 text-xs font-bold mb-2">Phần ${st.vidIdx + 1}/${l.video.length}: ${seg.h}</span>
              <div class="max-w-xl mx-auto px-4 py-3 rounded-xl bg-black/60 border border-white/10 text-slate-100 text-xs sm:text-sm leading-relaxed">“${seg.s}”</div>
            </div>
            <div class="bg-slate-900 px-4 py-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button onclick="togglePlay()" class="px-4 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold">${st.playing ? '⏸ Tạm dừng' : '▶ Phát bài giảng'}</button>
                <span class="text-xs font-mono text-slate-400">${seg.t} / 04:30</span>
              </div>
              <div class="flex gap-1.5">
                ${l.video.map((v, i) => `<button onclick="setVid(${i})" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${i === st.vidIdx ? 'bg-cyan-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}">${v.t}</button>`).join('')}
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderQuiz(l) {
      const best = st.scores[l.id];
      let right = 0;
      if (st.submitted) l.quiz.forEach((q, i) => { if (st.ans[i] === q.a) right++; });
      return `
        <div class="space-y-4">
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 class="text-base sm:text-lg font-extrabold">📝 Quiz Trắc nghiệm — ${l.code}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Chọn đáp án cho 5 câu hỏi và nhấn Nộp bài để xem giải thích chi tiết.</p>
            </div>
            ${best !== undefined ? `<span class="px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold">🏆 Điểm cao nhất: ${best}%</span>` : ''}
          </div>
          ${st.submitted ? `
            <div class="rounded-3xl p-5 border ${right >= 4 ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-300'} flex flex-wrap items-center justify-between gap-3">
              <div>
                <h4 class="font-extrabold text-base">Kết quả: ${right}/${l.quiz.length} câu đúng (${Math.round((right / l.quiz.length) * 100)}%)</h4>
                <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Xem giải thích chi tiết bên dưới mỗi câu hỏi.</p>
              </div>
              <button onclick="resetQuiz()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">🔄 Làm lại</button>
            </div>` : ''}
          ${l.quiz.map((item, qi) => {
            const sel = st.ans[qi];
            return `
              <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
                <div class="flex gap-3 mb-3">
                  <span class="w-6 h-6 rounded-lg bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-300 font-extrabold text-xs flex items-center justify-center shrink-0">${qi + 1}</span>
                  <h4 class="text-sm font-bold leading-snug">${item.q}</h4>
                </div>
                <div class="space-y-2">
                  ${item.o.map((opt, oi) => {
                    let cls = 'border-slate-200 dark:border-slate-800 hover:border-brand-400';
                    if (!st.submitted && sel === oi) cls = 'border-brand-600 bg-brand-50 dark:bg-brand-950/60 font-semibold';
                    else if (st.submitted && oi === item.a) cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 font-bold text-emerald-800 dark:text-emerald-200';
                    else if (st.submitted && sel === oi && oi !== item.a) cls = 'border-rose-500 bg-rose-50 dark:bg-rose-950/60 text-rose-800 dark:text-rose-200';
                    return `<button onclick="pickOpt(${qi},${oi})" ${st.submitted ? 'disabled' : ''} class="w-full text-left p-3 rounded-2xl border text-xs sm:text-sm flex justify-between items-center transition ${cls}">
                      <span><strong class="mr-1.5 font-mono">${String.fromCharCode(65 + oi)}.</strong>${opt}</span>
                      ${st.submitted && oi === item.a ? '<span class="text-emerald-600 font-bold">✓</span>' : ''}
                    </button>`;
                  }).join('')}
                </div>
                ${st.submitted ? `<div class="mt-3 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs leading-relaxed"><strong class="text-brand-600 dark:text-brand-400">💡 Giải thích:</strong> ${item.e}</div>` : ''}
              </div>`;
          }).join('')}
          ${!st.submitted ? `<div class="flex justify-end"><button onclick="submitQuiz()" class="px-6 py-2.5 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-extrabold shadow-sm">Nộp bài & Chấm điểm</button></div>` : ''}
        </div>`;
    }

    function renderMain() {
      const l = curLesson(), isDone = st.done.includes(l.id);
      $('b-code').textContent = l.code;
      $('b-tag').textContent = l.tag;
      $('b-title').textContent = l.title;
      $('b-sub').textContent = l.sub;
      $('b-status').className = `px-3 py-1 rounded-full text-xs font-semibold ${isDone ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'}`;
      $('b-status').textContent = isDone ? '✓ Đã hoàn thành' : '⏳ Đang học';
      $('complete-btn').className = `px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold shrink-0 transition ${isDone ? 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`;
      $('complete-btn').textContent = isDone ? '✓ Đã hoàn thành (Bỏ chọn)' : '✓ Đánh dấu hoàn thành';

      document.querySelectorAll('.tab-btn').forEach(b => {
        const active = b.dataset.tab === st.tab;
        b.className = `tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm transition ${active ? 'font-bold bg-brand-600 text-white shadow-xs' : 'font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}`;
      });

      const view = $('tab-view');
      view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');
      view.innerHTML = st.tab === 'lecture' ? renderLecture(l) : st.tab === 'diagram' ? renderDiagram(l) : st.tab === 'video' ? renderVideo(l) : renderQuiz(l);

      $('note-input').value = st.notes[l.id] || '';
      $('prev-btn').disabled = l.id === 1;
      $('next-btn').disabled = l.id === LESSONS.length;
    }

    // =========================================================================
    // SỰ KIỆN TƯƠNG TÁC
    // =========================================================================
    function stopVid() { if (vidTimer) { clearInterval(vidTimer); vidTimer = null; } st.playing = false; }
    function selectLesson(id) {
      stopVid(); st.curId = id; st.slide = 0; st.vidIdx = 0; st.ans = {}; st.submitted = false;
      localStorage.setItem(K.CUR, id);
      $('sidebar').classList.add('-translate-x-full'); $('backdrop').classList.add('hidden');
      renderNav(); renderMain(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function switchTab(t) { if (t !== 'video') stopVid(); st.tab = t; renderMain(); }
    function moveSlide(d) { const n = st.slide + d; if (n >= 0 && n < curLesson().slides.length) { st.slide = n; renderMain(); } }
    function goSlide(i) { st.slide = i; renderMain(); }
    function setVid(i) { st.vidIdx = i; renderMain(); }
    function togglePlay() {
      if (st.playing) { stopVid(); renderMain(); return; }
      st.playing = true; renderMain();
      vidTimer = setInterval(() => {
        if (st.vidIdx < curLesson().video.length - 1) { st.vidIdx++; renderMain(); }
        else { stopVid(); renderMain(); toast('Đã phát xong bài giảng minh họa!', 'ok'); }
      }, 4500);
    }
    function pickOpt(qi, oi) { if (!st.submitted) { st.ans[qi] = oi; renderMain(); } }
    function submitQuiz() {
      const l = curLesson();
      if (Object.keys(st.ans).length < l.quiz.length) return toast('Vui lòng chọn đủ 5 câu trước khi nộp bài!', 'warn');
      st.submitted = true;
      let right = 0; l.quiz.forEach((q, i) => { if (st.ans[i] === q.a) right++; });
      const pct = Math.round((right / l.quiz.length) * 100);
      if (pct >= (st.scores[l.id] || 0)) { st.scores[l.id] = pct; localStorage.setItem(K.QUIZ, JSON.stringify(st.scores)); }
      updateStats(); renderNav(); renderMain(); toast(`Hoàn thành Quiz: ${pct}%`, 'ok');
    }
    function resetQuiz() { st.ans = {}; st.submitted = false; renderMain(); }
    function exportMd() {
      const l = curLesson();
      const md = `# ${l.code}: ${l.title}\n> ${l.sub}\n\n## Thuật ngữ cốt lõi\n` +
        l.cards.map(([k, v]) => `- **${k}**: ${v}`).join('\n') + `\n\n## Tóm tắt trọng tâm\n` +
        l.notes.map(n => `- ${n.replace(/<[^>]*>?/gm, '')}`).join('\n');
      downloadFile(`COM109_Bai_${l.id}.md`, md);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem(K.THEME) === 'dark' || (!localStorage.getItem(K.THEME) && matchMedia('(prefers-color-scheme:dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      $('theme-btn').onclick = () => localStorage.setItem(K.THEME, document.documentElement.classList.toggle('dark') ? 'dark' : 'light');
      $('menu-btn').onclick = () => { $('sidebar').classList.toggle('-translate-x-full'); $('backdrop').classList.toggle('hidden'); };
      $('backdrop').onclick = () => { $('sidebar').classList.add('-translate-x-full'); $('backdrop').classList.add('hidden'); };

      $('search-input').oninput = e => { st.query = e.target.value; $('clear-search').classList.toggle('hidden', !st.query); renderNav(); };
      $('clear-search').onclick = () => { st.query = ''; $('search-input').value = ''; $('clear-search').classList.add('hidden'); renderNav(); };

      document.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => {
        st.filter = b.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(x => x.className = 'filter-btn py-1.5 rounded-lg font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300');
        b.className = 'filter-btn py-1.5 rounded-lg font-semibold bg-brand-600 text-white';
        renderNav();
      });

      document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

      $('complete-btn').onclick = () => {
        const idx = st.done.indexOf(st.curId);
        if (idx === -1) { st.done.push(st.curId); toast(`Đã hoàn thành Bài ${st.curId}!`, 'ok'); }
        else { st.done.splice(idx, 1); toast(`Đã bỏ đánh dấu Bài ${st.curId}.`); }
        localStorage.setItem(K.DONE, JSON.stringify(st.done));
        updateStats(); renderNav(); renderMain();
      };

      let nTimer = null;
      $('note-input').oninput = e => {
        $('note-status').textContent = '⏳ Đang lưu...';
        clearTimeout(nTimer);
        nTimer = setTimeout(() => { st.notes[st.curId] = e.target.value; localStorage.setItem(K.NOTES, JSON.stringify(st.notes)); $('note-status').textContent = '✓ Đã lưu'; }, 250);
      };
      $('export-note').onclick = () => downloadFile(`GhiChu_COM109_Bai_${st.curId}.txt`, `GHI CHÚ COM109 - BÀI ${st.curId}\n\n${$('note-input').value || '(Trống)'}`);

      $('prev-btn').onclick = () => st.curId > 1 && selectLesson(st.curId - 1);
      $('next-btn').onclick = () => st.curId < LESSONS.length && selectLesson(st.curId + 1);

      let confirmReset = false;
      $('reset-btn').onclick = () => {
        if (!confirmReset) {
          confirmReset = true; $('reset-btn').textContent = 'Nhấn lần nữa để xác nhận'; $('reset-btn').classList.add('bg-rose-600', 'text-white');
          setTimeout(() => { confirmReset = false; $('reset-btn').textContent = 'Đặt lại tiến độ'; $('reset-btn').classList.remove('bg-rose-600', 'text-white'); }, 3000);
        } else {
          confirmReset = false; st.done = []; st.scores = {};
          localStorage.removeItem(K.DONE); localStorage.removeItem(K.QUIZ);
          $('reset-btn').textContent = 'Đặt lại tiến độ'; $('reset-btn').classList.remove('bg-rose-600', 'text-white');
          updateStats(); renderNav(); renderMain(); toast('Đã đặt lại toàn bộ tiến độ.');
        }
      };

      updateStats(); renderNav(); renderMain();
    });
  </script>
</body>
</html>
